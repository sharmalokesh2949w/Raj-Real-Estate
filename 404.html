<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RAJ REAL ESTATE</title>
</head>

<body>

<script>
(function () {

    const path = window.location.pathname;

    const match = path.match(
        /^\/projects\/(jaipur|ajmer|mumbai|villasinmumbai)\/?$/
    );

    if (match) {

        window.location.replace(
            "/projects.html?city=" + encodeURIComponent(match[1])
        );

    } else {

        window.location.replace("/projects.html");

    }

})();
</script>

</body>
</html>
